<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scrollable Box</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 25px; }
        .scroll-box {
            height: 120px;
            overflow: auto;
            border: 2px solid #4a5568;
            padding: 12px;
            width: 280px;
            background-color: #edf2f7;
        }
        .scroll-box p {
            margin: 8px 0;
            padding: 6px;
            background-color: #ffffff;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Overflow Scrolling Demonstration</h1>
    <div class="scroll-box">
        <p>Line 1: Introduction to Web Standards.</p>
        <p>Line 2: Semantic HTML Elements.</p>
        <p>Line 3: CSS Cascading & Specificity.</p>
        <p>Line 4: Box Model and Border Calculations.</p>
        <p>Line 5: Modern Responsive Media Queries.</p>
    </div>
</body>
</html>
