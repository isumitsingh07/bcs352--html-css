<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box Model Comparison</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .box1 {
            width: 200px;
            padding: 20px;
            border: 5px solid #2b6cb0;
            box-sizing: content-box;
            background-color: #ebf8ff;
            margin-bottom: 20px;
        }
        .box2 {
            width: 200px;
            padding: 20px;
            border: 5px solid #c53030;
            box-sizing: border-box;
            background-color: #fff5f5;
        }
    </style>
</head>
<body>
    <h1>Box Sizing Comparison</h1>
    <div class="box1">
        <strong>Box 1 (content-box):</strong> Total width = 200 + 40 (padding) + 10 (border) = 250px.
    </div>
    <div class="box2">
        <strong>Box 2 (border-box):</strong> Total width remains exactly 200px including padding and border.
    </div>
</body>
</html>
