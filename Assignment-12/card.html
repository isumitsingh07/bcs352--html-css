<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Card Component</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background-color: #f7fafc; }
        .card {
            background-color: #ffffff;
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            padding: 16px;
            width: 300px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card h3 {
            margin-top: 0;

            color: #718096;
            margin-bottom: 0;
        }

</head>
<body>
