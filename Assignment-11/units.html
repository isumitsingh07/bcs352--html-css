<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Units</title>
    <style>
        .box-px {
            width: 200px;
            height: 40px;
            background-color: #48bb78;
            margin-bottom: 12px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .box-percent {
            width: 50%;
            height: 40px;
            background-color: #4299e1;
            margin-bottom: 12px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .large-text {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <h1>CSS Units Demonstration</h1>
    <div class="box-px">200px Wide Box</div>
    <div class="box-percent">50% Wide Box</div>
    <p class="large-text">This paragraph is styled with a relative unit of 1.5rem font size.</p>
</body>
</html>
