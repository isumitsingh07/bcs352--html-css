<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .image-container {
            width: 80%;
            max-width: 500px;
            border: 2px solid #cbd5e0;
            padding: 10px;
            border-radius: 8px;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Responsive Image Scaling</h1>
    <div class="image-container">
        <img src="images/sample.jpg" alt="Responsive graphic displaying dynamic scaling">
    </div>
</body>
</html>
