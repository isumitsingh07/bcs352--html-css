<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Required Sign Up</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 120px; font-weight: bold; }
        input { padding: 6px; width: 240px; }
        button { padding: 8px 18px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Required Registration Form</h1>
    <form action="thanks.html" method="post">
        <div class="form-group">
            <label for="reg-name">Full Name:</label>
            <input type="text" id="reg-name" name="fullname" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
            <label for="reg-email">Email:</label>
            <input type="email" id="reg-email" name="email" required>
        </div>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
