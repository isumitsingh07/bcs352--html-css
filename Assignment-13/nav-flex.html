<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox Navigation Bar</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        nav {
            display: flex;
            background-color: #1a202c;
            padding: 14px 20px;
            gap: 25px;
            border-radius: 6px;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
        }
        nav a:hover {
            color: #63b3ed;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#events">Events</a>
        <a href="#contact">Contact</a>
    </nav>
</body>
</html>
