<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline and Internal CSS</title>
    <style>
        h1 {
            color: navy;
        }
        .highlight {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Introduction to CSS Styling</h1>
    <p style="color: red;">This paragraph is styled using an inline CSS attribute to make the text red.</p>
    <p class="highlight">This paragraph utilizes the highlight class defined inside the internal style block.</p>
</body>
</html>
