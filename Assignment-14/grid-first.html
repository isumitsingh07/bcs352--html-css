<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>First CSS Grid</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 25px; }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            max-width: 600px;
        }
        .box {
            background-color: #3182ce;
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 30px;
            text-align: center;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>Equal Columns Grid</h1>
    <div class="grid-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>
</body>
</html>
