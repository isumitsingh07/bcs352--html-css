<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Gallery Grid</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 25px; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .photo-box {
            background-color: #edf2f7;
            border: 2px dashed #a0aec0;
            padding: 35px 15px;
            text-align: center;
            font-weight: bold;
            color: #4a5568;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Club Photo Gallery</h1>
    <div class="gallery-grid">
        <div class="photo-box">Photo 1</div>
        <div class="photo-box">Photo 2</div>
        <div class="photo-box">Photo 3</div>
        <div class="photo-box">Photo 4</div>
        <div class="photo-box">Photo 5</div>
        <div class="photo-box">Photo 6</div>
    </div>
</body>
</html>
